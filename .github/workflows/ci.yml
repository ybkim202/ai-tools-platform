name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (build + 토큰 가드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 디자인 토큰 가드 — 사용처 CSS raw hex 재유입 차단(무채색/토큰 회귀 방지)
      - name: 디자인 토큰 가드
        working-directory: .
        run: bash scripts/check-design-tokens.sh
      # CI=true 라 경고도 에러로 처리됨
      - name: 빌드
        run: CI=true npm run build

  backend:
    name: Backend (compile + import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 바이트컴파일
        run: python -m compileall app
      - name: 앱 임포트 (라우트 로드)
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
        run: python -c "import app.main; print('routes:', len(app.main.app.routes))"
